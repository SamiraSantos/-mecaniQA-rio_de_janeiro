apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-simulator
spec:
  # O alvo estático abaixo representa um único simulador.
  replicas: 1
  selector:
    matchLabels:
      app: iot-simulator
  template:
    metadata:
      labels:
        app: iot-simulator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: mecaniqa-iot-simulator:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: SENSOR_COUNT
              value: "3"
            - name: SAMPLE_INTERVAL_SECONDS
              value: "2"
            - name: SENSOR_ERROR_RATE
              value: "0.05"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: iot-simulator
spec:
  selector:
    app: iot-simulator
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
