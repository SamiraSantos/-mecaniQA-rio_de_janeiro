spring:
  application:
    name: mecaniqa-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mecaniqa?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:mecaniqa}
    password: ${SPRING_DATASOURCE_PASSWORD:mecaniqa_local_2026}
    hikari:
      initialization-fail-timeout: 60000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 5s
      timeout: 5s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: MecaniQA API
    description: Piloto de isolamento com Java, MySQL e Redis
